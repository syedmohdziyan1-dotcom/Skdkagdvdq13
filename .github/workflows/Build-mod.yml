name: Build Beacon Printer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          unzip -q .github/workflows/beacon-printer-fabric-1.21.11-rebuild-source.zip -d .
          test -f beacon-printer/build.gradle

      - name: Fix Gradle repository configuration
        working-directory: beacon-printer
        run: |
          python3 <<'PY'
          from pathlib import Path

          for pattern in ("*.gradle", "*.gradle.kts"):
              for file in Path(".").rglob(pattern):
                  if ".gradle" in file.parts:
                      continue

                  content = file.read_text()

                  updated = content.replace(
                      "RepositoriesMode.PREFER_SETTINGS",
                      "RepositoriesMode.PREFER_PROJECT"
                  ).replace(
                      "RepositoriesMode.FAIL_ON_PROJECT_REPOS",
                      "RepositoriesMode.PREFER_PROJECT"
                  ).replace(
                      "PREFER_SETTINGS",
                      "PREFER_PROJECT"
                  )

                  if updated != content:
                      file.write_text(updated)
                      print(f"Updated: {file}")

          print("Gradle repository configuration check completed.")
          PY

      - name: Diagnose Gradle settings
        working-directory: beacon-printer
        run: |
          echo "=== Gradle settings files ==="
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          echo "=== Settings contents ==="
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec sh -c '
            echo "FILE: $1"
            cat "$1"
          ' _ {} \;

      - name: Compile mod
        working-directory: beacon-printer
        run: gradle build --no-daemon --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-Printer-JAR
          path: beacon-printer/build/libs/*.jar
          if-no-files-found: error
