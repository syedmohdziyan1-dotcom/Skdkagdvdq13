name: Build Beacon Printer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          unzip -q .github/workflows/beacon-printer-fabric-1.21.11-rebuild-source.zip -d .
          test -f beacon-printer/build.gradle

      - name: Fix repository configuration
        working-directory: beacon-printer
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' {} +
          if grep -R "PREFER_SETTINGS" . --include="*.gradle" --include="*.gradle.kts"; then
            echo "Repository setting was not replaced"
            exit 1
          fi

      - name: Compile mod
        working-directory: beacon-printer
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Beacon-Printer-JAR
          path: beacon-printer/build/libs/*.jar
          if-no-files-found: error
