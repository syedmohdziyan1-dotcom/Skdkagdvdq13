      - name: Diagnose Gradle settings
        working-directory: beacon-printer
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
          echo "=== Settings file contents ==="
          for f in $(find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)); do
            echo "=== $f ==="
            cat "$f"
          done
